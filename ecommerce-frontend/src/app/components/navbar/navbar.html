<nav
  [class]="isHomePage
    ? 'absolute top-0 left-0 right-0 z-50 bg-transparent text-white'
    : 'sticky top-0 z-50 bg-[#1C1917] text-white border-b border-white/5'">
  <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2.5 group">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#D97706] to-[#B45309] flex items-center justify-center shadow-lg shadow-[#D97706]/40 group-hover:scale-105 transition-transform">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight">
        Shop<span class="bg-gradient-to-r from-[#FCD34D] to-[#D97706] bg-clip-text text-transparent">Easy</span>
      </span>
    </a>

    <!-- Desktop links -->
    <div class="hidden md:flex items-center gap-1">
      <a routerLink="/" routerLinkActive="text-[#FCD34D] bg-white/5" [routerLinkActiveOptions]="{ exact: true }"
         class="px-4 py-2 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5 transition-all">
        Home
      </a>
      <a routerLink="/products" routerLinkActive="text-[#FCD34D] bg-white/5"
         class="px-4 py-2 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5 transition-all">
        Products
      </a>

      @if (isLoggedIn) {
        <a routerLink="/cart" routerLinkActive="text-[#FCD34D] bg-white/5"
           class="px-4 py-2 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5 transition-all flex items-center gap-2">
          Cart
          @if (cartCount > 0) {
            <span class="min-w-[20px] h-5 px-1.5 rounded-full bg-gradient-to-r from-[#D97706] to-[#B45309] text-white text-[11px] font-bold flex items-center justify-center">
              {{ cartCount }}
            </span>
          }
        </a>
        <a routerLink="/orders" routerLinkActive="text-[#FCD34D] bg-white/5"
           class="px-4 py-2 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5 transition-all">
          My Orders
        </a>
        <a routerLink="/profile" routerLinkActive="text-[#FCD34D] bg-white/5"
           class="px-4 py-2 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5 transition-all">
          Profile
        </a>
        @if (isAdmin) {
          <a routerLink="/admin" routerLinkActive="text-[#FCD34D] bg-white/5"
             class="px-4 py-2 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5 transition-all flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-[#FCD34D] animate-pulse"></span>
            Admin
          </a>
        }
        <div class="w-px h-6 bg-white/10 mx-2"></div>
        <button (click)="logout()"
                class="px-4 py-2 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-[#DC2626] hover:bg-[#DC2626]/10 transition-all">
          Logout
        </button>
      } @else {
        <div class="w-px h-6 bg-white/10 mx-2"></div>
        <a routerLink="/login" routerLinkActive="text-[#FCD34D] bg-white/5"
           class="px-4 py-2 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5 transition-all">
          Login
        </a>
        <a routerLink="/register"
           class="ml-1 px-5 py-2 rounded-lg text-sm font-semibold bg-gradient-to-r from-[#D97706] to-[#B45309] text-white shadow-lg shadow-[#D97706]/30 hover:shadow-xl hover:shadow-[#D97706]/40 hover:-translate-y-0.5 transition-all">
          Register
        </a>
      }
    </div>

    <!-- Mobile toggle -->
    <button (click)="toggleMobile()"
            class="md:hidden p-2 rounded-lg text-[#E7E5E4] hover:text-white hover:bg-white/5 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        @if (mobileOpen) {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        }
      </svg>
    </button>
  </div>

  <!-- Mobile menu -->
  @if (mobileOpen) {
    <div class="md:hidden border-t border-white/10 bg-[#1C1917]/95 backdrop-blur-lg px-6 py-4 space-y-1">
      <a routerLink="/" (click)="closeMobile()" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5">Home</a>
      <a routerLink="/products" (click)="closeMobile()" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5">Products</a>
      @if (isLoggedIn) {
        <a routerLink="/cart" (click)="closeMobile()" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5">Cart</a>
        <a routerLink="/orders" (click)="closeMobile()" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5">My Orders</a>
        <a routerLink="/profile" (click)="closeMobile()" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5">Profile</a>
        @if (isAdmin) {
          <a routerLink="/admin" (click)="closeMobile()" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5">Admin</a>
        }
        <button (click)="logout()" class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-[#DC2626] hover:bg-[#DC2626]/10">Logout</button>
      } @else {
        <a routerLink="/login" (click)="closeMobile()" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-[#E7E5E4] hover:text-white hover:bg-white/5">Login</a>
        <a routerLink="/register" (click)="closeMobile()" class="block text-center px-4 py-2.5 rounded-lg text-sm font-semibold bg-gradient-to-r from-[#D97706] to-[#B45309] text-white">Register</a>
      }
    </div>
  }
</nav>
