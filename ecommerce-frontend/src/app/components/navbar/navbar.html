<nav class="bg-black text-white px-6 py-4 flex items-center justify-between">

  <a routerLink="/" class="text-2xl font-bold">
    ShopEasy
  </a>

  <div class="flex items-center gap-6">

    <a routerLink="/">
      Home
    </a>

    <a routerLink="/products">
      Products
    </a>

    @if (isLoggedIn) {

      <a routerLink="/cart">
        Cart
        @if (cartCount > 0) {
          ({{ cartCount }})
        }
      </a>

      <a routerLink="/orders">
        My Orders
      </a>

      <a routerLink="/profile">
        Profile
      </a>

      @if (isAdmin) {
        <a routerLink="/admin">
          Admin
        </a>
      }

      <button (click)="logout()">
        Logout
      </button>

    } @else {

      <a routerLink="/login">
        Login
      </a>

      <a routerLink="/register">
        Register
      </a>

    }

  </div>

</nav>
