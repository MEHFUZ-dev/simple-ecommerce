<div class="min-h-screen bg-gradient-to-b from-[#FAFAF9] via-[#F5F5F4] to-[#FAFAF9] antialiased">

  <!-- ============ PAGE HEADER BAND ============ -->
  <section class="relative overflow-hidden bg-[#1C1917] text-white">
    <!-- Dark fade behind transparent navbar -->
    <div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-[#1C1917] via-[#1C1917]/60 to-transparent pointer-events-none"></div>

    <!-- Decorative amber blobs -->
    <div class="absolute -top-24 -left-24 w-80 h-80 bg-[#D97706]/25 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-24 w-96 h-96 bg-[#F59E0B]/15 rounded-full blur-3xl"></div>

    <div class="relative max-w-4xl mx-auto px-6 pt-32 pb-24 text-center">
      <p class="text-[#FCD34D] font-semibold text-sm uppercase tracking-widest mb-3">
        Welcome Back
      </p>
      <h1 class="text-4xl md:text-5xl font-bold tracking-tight">
        Sign <span class="bg-gradient-to-r from-[#FCD34D] to-[#D97706] bg-clip-text text-transparent">In</span>
      </h1>
      <p class="text-[#D6D3D1] mt-4 max-w-xl mx-auto">
        Log in to your ShopEasy account to continue shopping.
      </p>
    </div>
  </section>


  <!-- ============ LOGIN FORM ============ -->
  <div class="max-w-md mx-auto px-6 -mt-16 relative z-10 pb-20">

    <div class="bg-white rounded-2xl border border-[#E7E5E4] shadow-xl shadow-black/5 overflow-hidden">

      <!-- Card header -->
      <div class="relative px-6 py-5 bg-gradient-to-br from-[#1C1917] to-[#292524] text-white overflow-hidden">
        <div class="absolute -top-16 -right-16 w-56 h-56 bg-[#D97706]/20 rounded-full blur-3xl"></div>
        <div class="relative flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#D97706] to-[#B45309] flex items-center justify-center shadow-lg shadow-[#D97706]/40">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <div>
            <h2 class="text-base font-bold">Account Login</h2>
            <p class="text-xs text-[#A8A29E]">Enter your credentials below</p>
          </div>
        </div>
      </div>

      <!-- Card body -->
      <div class="p-6">

        @if (errorMessage) {
          <div class="flex items-start gap-3 bg-red-50 border border-red-200 text-red-800 p-3.5 rounded-xl mb-5">
            <div class="w-7 h-7 rounded-lg bg-red-100 flex items-center justify-center shrink-0">
              <svg class="w-4 h-4 text-[#DC2626]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <p class="text-sm font-medium pt-1">{{ errorMessage }}</p>
          </div>
        }

        <form (ngSubmit)="login()" class="space-y-5">

          <!-- Username -->
          <div>
            <label class="block text-xs font-semibold text-[#57534E] uppercase tracking-wider mb-2">
              Username
            </label>
            <div class="relative">
              <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-[#A8A29E] pointer-events-none"
                   fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              <input
                type="text"
                name="username"
                [(ngModel)]="username"
                required
                placeholder="your username"
                class="w-full bg-[#FAFAF9] border border-[#E7E5E4] rounded-xl pl-10 pr-4 py-2.5 text-sm text-[#292524] placeholder:text-[#A8A29E] focus:outline-none focus:border-[#D97706] focus:ring-4 focus:ring-[#D97706]/10 transition-all"
              />
            </div>
          </div>

          <!-- Password -->
          <div>
            <label class="block text-xs font-semibold text-[#57534E] uppercase tracking-wider mb-2">
              Password
            </label>
            <div class="relative">
              <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-[#A8A29E] pointer-events-none"
                   fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
              <input
                type="password"
                name="password"
                [(ngModel)]="password"
                required
                placeholder="••••••••"
                class="w-full bg-[#FAFAF9] border border-[#E7E5E4] rounded-xl pl-10 pr-4 py-2.5 text-sm text-[#292524] placeholder:text-[#A8A29E] focus:outline-none focus:border-[#D97706] focus:ring-4 focus:ring-[#D97706]/10 transition-all"
              />
            </div>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="group w-full flex items-center justify-center gap-2 bg-gradient-to-r from-[#D97706] to-[#B45309] text-white py-3 rounded-xl font-semibold shadow-lg shadow-[#D97706]/30 hover:shadow-xl hover:shadow-[#D97706]/40 hover:-translate-y-0.5 transition-all">
            Login
            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
            </svg>
          </button>

        </form>

        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-[#E7E5E4]"></div>
          </div>
          <div class="relative flex justify-center">
            <span class="bg-white px-3 text-xs text-[#A8A29E] uppercase tracking-wider">or</span>
          </div>
        </div>

        <!-- Register link -->
        <p class="text-center text-sm text-[#78716C]">
          Don't have an account?
          <a routerLink="/register" class="font-semibold text-[#D97706] hover:text-[#B45309] transition-colors">
            Create one
          </a>
        </p>

      </div>

    </div>

  </div>

</div>
