<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-md">

    <h1 class="text-3xl font-bold text-center mb-6">
      Create Account
    </h1>

    @if (errorMessage) {
      <div class="bg-red-100 text-red-700 p-3 rounded mb-4">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="register()" class="space-y-4">

      <div>
        <label class="block font-medium mb-1">
          Username
        </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          required
          class="w-full border rounded-lg p-3"
        />
      </div>

      <div>
        <label class="block font-medium mb-1">
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          class="w-full border rounded-lg p-3"
        />
      </div>

      <div>
        <label class="block font-medium mb-1">
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          class="w-full border rounded-lg p-3"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-black text-white py-3 rounded-lg">
        Register
      </button>

    </form>

  </div>

</div>
